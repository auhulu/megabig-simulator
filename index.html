    <script>
      try {
        var stored = localStorage.getItem('mantine-color-scheme-value');
        var scheme = stored === 'light' || stored === 'dark' || stored === 'auto' ? stored : 'light';
        document.documentElement.setAttribute('data-mantine-color-scheme',
          scheme === 'auto' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : scheme);
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
